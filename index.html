    const { useState, useEffect, useRef } = React;

    // Canvas Neural Net Background Component
    const ParticleNetwork = () => {
      const canvasRef = useRef(null);
      
      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let particles = [];
        const particleCount = 40;
        
        const resizeCanvas = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        for (let i = 0; i < particleCount; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.3,
            vy: (Math.random() - 0.5) * 0.3,
            radius: Math.random() * 1.5 + 1
          });
        }
        
        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = 'rgba(9, 9, 11, 0.06)';
          ctx.strokeStyle = 'rgba(9, 9, 11, 0.025)';
          
          particles.forEach((p, idx) => {
            p.x += p.vx;
            p.y += p.vy;
            
            if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            
            for (let j = idx + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
              if (dist < 130) {
                ctx.lineWidth = (1 - dist / 130) * 0.45;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
              }
            }
          });
          
          animationFrameId = requestAnimationFrame(animate);
        };
        
        animate();
        
        return () => {
          window.removeEventListener('resize', resizeCanvas);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);
      
      return <canvas ref={canvasRef} className="absolute inset-0 pointer-events-none z-0 opacity-70" />;
    };

    // Cursor Follower glow sphere
    const MouseGlow = () => {
      const [mousePos, setMousePos] = useState({ x: -200, y: -200 });
      const [targetPos, setTargetPos] = useState({ x: -200, y: -200 });
      
      useEffect(() => {
        const handleMouseMove = (e) => {
          setTargetPos({ x: e.clientX, y: e.clientY });
        };
        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, []);

      useEffect(() => {
        let frameId;
        const ease = 0.06;
        
        const updatePosition = () => {
          setMousePos(prev => {
            const dx = targetPos.x - prev.x;
            const dy = targetPos.y - prev.y;
            return {
              x: prev.x + dx * ease,
              y: prev.y + dy * ease
            };
          });
          frameId = requestAnimationFrame(updatePosition);
        };
        
        updatePosition();
        return () => cancelAnimationFrame(frameId);
      }, [targetPos]);
      
      return (
        <div 
          className="fixed pointer-events-none z-10 w-[250px] h-[250px] rounded-full bg-violet-100/15 filter blur-[70px]"
          style={{
            left: `${mousePos.x - 125}px`,
            top: `${mousePos.y - 125}px`,
            transform: 'translate3d(0, 0, 0)'
          }}
        />
      );
    };

    // Morphing Typewriter effect in Hero Section
    const MorphingHeadline = () => {
      const titles = ["AI/ML Systems.", "Computer Vision.", "Generative AI.", "Neural Architectures."];
      const [index, setIndex] = useState(0);
      const [subIndex, setSubIndex] = useState(0);
      const [reverse, setReverse] = useState(false);
      
      useEffect(() => {
        if (subIndex === titles[index].length + 1 && !reverse) {
          setTimeout(() => setReverse(true), 2000);
          return;
        }
        
        if (subIndex === 0 && reverse) {
          setReverse(false);
          setIndex((prev) => (prev + 1) % titles.length);
          return;
        }
        
        const timeout = setTimeout(() => {
          setSubIndex((prev) => prev + (reverse ? -1 : 1));
        }, reverse ? 30 : 70);
        
        return () => clearTimeout(timeout);
      }, [subIndex, reverse, index]);
      
      return (
        <span className="border-r-2 border-neutral-800 pr-1 animate-pulse font-bold text-neutral-900">
          {titles[index].substring(0, subIndex)}
        </span>
      );
    };

                          <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
                        </svg>
                      </div>
                      <span className="font-medium">linkedin.com/in/chetanlol</span>
                    </a>
                  </div>
                </div>

                <div className="lg:col-span-8">
                  <div className="glass-card shimmer-card rounded-3xl p-8 border border-neutral-100">
                    <form onSubmit={handleContactSubmit} className="space-y-6">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div className="space-y-2">
                          <label className="text-xs font-semibold uppercase tracking-wider text-neutral-400">Your Name</label>
                          <input type="text" required placeholder="e.g. John Doe" className="w-full bg-white/40 border border-neutral-200 focus:border-neutral-900 focus:bg-white rounded-xl px-4 py-3 text-sm focus:outline-none transition-all duration-300" />
                        </div>
                        <div className="space-y-2">
                          <label className="text-xs font-semibold uppercase tracking-wider text-neutral-400">Email Address</label>
                          <input type="email" required placeholder="e.g. john@example.com" className="w-full bg-white/40 border border-neutral-200 focus:border-neutral-900 focus:bg-white rounded-xl px-4 py-3 text-sm focus:outline-none transition-all duration-300" />
                        </div>
                      </div>

                      <div className="space-y-2">
                        <label className="text-xs font-semibold uppercase tracking-wider text-neutral-400">Your Message</label>
                        <textarea rows="5" required placeholder="Describe your project, timeline, or job details..." className="w-full bg-white/40 border border-neutral-200 focus:border-neutral-900 focus:bg-white rounded-xl px-4 py-3 text-sm focus:outline-none resize-none transition-all duration-300"></textarea>
                      </div>

                      <button type="submit" disabled={formStatus === 'submitting'} className="w-full sm:w-auto px-8 py-4 rounded-full bg-neutral-950 hover:bg-neutral-900 text-white font-medium text-sm tracking-wide transition-all shadow-md shadow-neutral-950/10 hover:shadow-neutral-950/20 duration-300 disabled:opacity-50">
                        {formStatus === 'submitting' ? 'Sending...' : 'Send Message'}
                      </button>
                    </form>

                    {formStatus === 'success' && (
                      <div className="flex items-center justify-between p-4 bg-emerald-50 border border-emerald-100 text-emerald-800 rounded-2xl mt-4 animate-fade-in">
                        <div className="flex items-center gap-2">
                          <svg className="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                          </svg>
                          <span className="text-sm font-medium">Thank you! Your message was processed successfully.</span>
                        </div>
                        <button onClick={() => setFormStatus('idle')} className="text-emerald-500 hover:text-emerald-700">
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                          </svg>
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </section>

          </main>

          <footer className="border-t border-neutral-100 bg-white/60 backdrop-blur-md relative z-10 py-12">
            <div className="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-6">
              <div className="flex items-center gap-2">
                <span className="font-display font-bold text-sm tracking-widest text-neutral-900 uppercase">Chetan Tirumani</span>
                <span className="w-1.5 h-1.5 rounded-full bg-neutral-900"></span>
              </div>
              <div className="text-xs text-neutral-400 font-medium">
                &copy; 2026 Chetan Tirumani. All rights reserved. Crafted with React state animations and glassmorphism.
              </div>
            </div>
          </footer>

          {selectedProject && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-neutral-950/30 backdrop-blur-md" onClick={() => setSelectedProject(null)}></div>
              <div className="glass-panel w-full max-w-2xl rounded-3xl overflow-hidden relative z-10 shadow-2xl animate-slide-up border border-white">
                <div className="flex items-center justify-between p-6 border-b border-neutral-100 bg-white/80">
                  <h4 className="font-display text-xl font-bold text-neutral-900">
                    {projectSpecs[selectedProject]?.title || 'Project Specifications'}
                  </h4>
                  <button onClick={() => setSelectedProject(null)} className="p-1 rounded-full text-neutral-400 hover:text-neutral-900 hover:bg-neutral-50 transition-all">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>
                <div className="p-8 space-y-6 max-h-[70vh] overflow-y-auto bg-white/40">
                  {projectSpecs[selectedProject]?.content}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
